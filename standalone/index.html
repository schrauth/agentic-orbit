<!DOCTYPE html>
<!-- The live map page: the same drawing the panel shows, fed by the host's stream instead of a
     webview. The host decides what the map shows; this page renders it, and its side menu —
     behind the three bars — lets the person tune the looks without asking the host for a new setup. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Orbit — live map</title>
<link rel="stylesheet" href="main.css">
</head>
<body>
<div id="topbar">
  <div class="bar-left">
    <button id="menubtn" class="btn" aria-label="Open the looks menu" aria-expanded="false" aria-controls="drawer">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>
    <span id="title">Agentic Orbit</span>
    <span id="connection" class="waiting">waiting</span>
  </div>
  <button id="optionsbtn" class="btn" aria-label="Open the looks menu" aria-expanded="false" aria-controls="drawer">Options</button>
</div>
<div id="scrim"></div>
<div id="drawer" aria-label="The looks menu">
  <div class="drawer-group">
    <label for="theme">Palette</label>
    <select id="theme" title="The map's palette">
      <option value="auto">auto</option>
      <option value="dark">dark</option>
      <option value="light">light</option>
    </select>
  </div>
  <div class="drawer-group">
    <label for="layout">Layout</label>
    <select id="layout" title="Where you sit on the map">
      <option value="you-top">you top</option>
      <option value="you-bottom">you bottom</option>
    </select>
  </div>
  <div class="drawer-group">
    <label for="motion">Motion</label>
    <select id="motion" title="How much the map moves">
      <option value="full">full</option>
      <option value="reduced">reduced</option>
    </select>
  </div>
  <div class="drawer-group">
    <label for="pace">Pace</label>
    <select id="pace" title="The speed of the data exchanges">
      <option value="normal">normal</option>
      <option value="slow">slow</option>
    </select>
  </div>
  <div class="drawer-group">
    <label for="language">Language</label>
    <select id="language" title="The language of the labels"></select>
  </div>
</div>
<div id="main">
  <div id="stage">
    <div id="map"></div>
    <div id="buttons"></div>
  </div>
  <div id="feedwrap">
    <div id="feed" hidden></div>
    <div id="log" aria-label="The session's calls, one line each"></div>
    <div id="nowline"></div>
    <div id="counts"></div>
  </div>
</div>
<script src="bundle.js"></script>
</body>
</html>
