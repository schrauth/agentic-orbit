<!DOCTYPE html>
<!-- The live map page: the same drawing the panel shows, fed by the host's stream instead of a
     webview. The host decides what the map shows; this page renders it, and its thin header
     lets the person tune the looks without asking the host for a new setup. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Orbit — live map</title>
<link rel="stylesheet" href="main.css">
</head>
<body>
<div id="topbar">
  <div class="bar-left">
    <span id="title">Agentic Orbit</span>
    <span id="connection" class="waiting">waiting</span>
  </div>
  <div class="bar-right">
    <select id="theme" title="The map's palette">
      <option value="auto">auto</option>
      <option value="dark">dark</option>
      <option value="light">light</option>
    </select>
    <select id="layout" title="Where you sit on the map">
      <option value="you-top">you top</option>
      <option value="you-bottom">you bottom</option>
    </select>
    <select id="motion" title="How much the map moves">
      <option value="full">motion full</option>
      <option value="reduced">motion reduced</option>
    </select>
    <select id="pace" title="The speed of the data exchanges">
      <option value="normal">pace normal</option>
      <option value="slow">pace slow</option>
    </select>
    <select id="language" title="The language of the labels"></select>
  </div>
</div>
<div id="main">
  <div id="stage">
    <div id="map"></div>
    <div id="nowline"></div>
    <div id="counts"></div>
    <div id="buttons"></div>
  </div>
  <div id="feedwrap">
    <div id="feed"></div>
  </div>
</div>
<script src="bundle.js"></script>
</body>
</html>
